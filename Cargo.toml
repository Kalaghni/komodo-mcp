[package]
name = "komodo-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for the Komodo deployment platform: inspect servers, stacks, swarms and builds, and optionally deploy"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Kalaghni/komodo-mcp"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = { version = "3.6", features = ["server", "macros", "transport-io", "schemars"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "io-std", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
